name: Windows checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l cmd internal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($files) { throw "Run gofmt -w cmd internal. Unformatted files: $files" }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 -timeout=3m ./...
      - name: Build Windows binaries
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          foreach ($arch in 'amd64', 'arm64') {
            $env:GOARCH = $arch
            go build -trimpath -o "bin/procly-windows-$arch.exe" ./cmd/procly
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: procly-windows-development
          path: bin/*.exe
          if-no-files-found: error
