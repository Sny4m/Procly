name: Windows CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l cmd internal
          if ($files) { throw "Unformatted Go files: $files" }
      - name: Vet
        run: go vet ./...
      - name: Test Windows behavior
        run: go test -race -count=1 -timeout=3m ./...
      - name: Build Windows AMD64
        run: go build -trimpath -o bin/procly.exe ./cmd/procly
      - name: Cross-compile Windows ARM64
        shell: pwsh
        run: |
          $env:GOARCH = 'arm64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -o bin/procly-windows-arm64.exe ./cmd/procly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: procly-windows-development
          path: bin/*.exe
